[project]
name = "ctxproxy"
version = "0.1.0"
description = "Context-management proxy for Claude Code — Anthropic-native and OpenAI-compatible backends"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.8"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8"]

[project.scripts]
ctxproxy = "ctxproxy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG", "SIM", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented idiom is calling Option()/Argument() in defaults.
"src/ctxproxy/cli.py" = ["B008"]
# Test doubles deliberately ignore the args they are handed.
"tests/*" = ["ARG001", "ARG002"]
